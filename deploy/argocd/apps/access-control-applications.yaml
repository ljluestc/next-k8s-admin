apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-access-control
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ljluestc/next-k8s-admin
    targetRevision: private/feature/auth-oidc
    path: deploy/apps/kyverno-access-control
    helm:
      releaseName: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

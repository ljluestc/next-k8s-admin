apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ljluestc/next-k8s-admin
    targetRevision: private/feature/auth-oidc
    path: deploy/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

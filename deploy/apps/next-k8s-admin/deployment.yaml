apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-k8s-admin
  labels:
    app.kubernetes.io/name: next-k8s-admin
    app.kubernetes.io/part-of: next-k8s-admin
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: next-k8s-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: next-k8s-admin
      annotations:
        gitops.release/version: "v2"
    spec:
      containers:
        - name: next-k8s-admin
          image: nginx:1.27.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
